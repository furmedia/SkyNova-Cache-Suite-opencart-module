# Adapt inside the shop's existing server block. Validate with nginx -t.
# Static generated assets only; never enable public HTML cache here.
location ~ ^/image/cache/furmedia_cache/[a-f0-9]{64}\.(css|js|webp|avif)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location ~ ^/image/cache/furmedia_cache/(\.|minify-|convert-) {
    deny all;
}
